<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script Tempo</title>
</head>
<body>
    <h1>Data completa: </h1>
    <h2 id="complete">Any</h2>
    <div style="background-color: black; height: 10px; width: 100%;"></div>
    <h1>Ano: </h1>
    <h2 id="completeyear">Any</h2>
    <div style="background-color: black; height: 10px; width: 100%;"></div>
    <h1>Mês: </h1>
    <h2 id="month">Any</h2>
    <div style="background-color: black; height: 10px; width: 100%;"></div>
    <h1>Day: </h1>
    <h2 id="day">Any</h2>
    <div style="background-color: black; height: 10px; width: 100%;"></div>
    <h1>Dia da semana: </h1>
    <h2 id="week">Any</h2>
    <div style="background-color: black; height: 10px; width: 100%;"></div>
    <h1>Minutos: </h1>
    <h2 id="minutes">Any</h2>
    <div style="background-color: black; height: 10px; width: 100%;"></div>
    <h1>Segundos: </h1>
    <h2 id="seconds">Any</h2>
    <div style="background-color: black; height: 10px; width: 100%;"></div>
    <h1>MiliSegundos: </h1>
    <h2 id="miliseconds">Any</h2>
    <div style="background-color: black; height: 10px; width: 100%;"></div>
    
    <script src="index.js"></script>
</body>
</html>
